name = "jioodev-edge-site"
main = "workers/edge-site.mjs"
compatibility_date = "2026-11-01"

# Published sites are served from KV. `ORIGIN` is the Next.js deployment that
# keeps the existing /p/<slug> routes as a fallback and as the source of truth.
[vars]
ORIGIN = "https://app.jioo.site"

[[kv_namespaces]]
binding = "SITE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[observability]
enabled = true
