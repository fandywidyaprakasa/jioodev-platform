<section class="s-hero" aria-labelledby="s-hero-title">
  <div class="s-hero__copy">
    <p class="s-hero__eyebrow">{{eyebrow}}</p>
    <h1 class="s-hero__title" id="s-hero-title">{{headline}}</h1>
    <p class="s-hero__lead">{{subheadline}}</p>
    <div class="s-hero__actions">
      <a class="s-btn" href="{{primary_cta.href}}">{{primary_cta.label}}</a>
      <a class="s-btn s-btn--ghost" href="{{secondary_cta.href}}">{{secondary_cta.label}}</a>
    </div>
  </div>
  <div class="s-hero__media">
    <img src="{{media.src}}" alt="{{media.alt}}" width="640" height="480" loading="eager" />
  </div>
</section>
