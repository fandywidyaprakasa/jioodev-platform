<section class="s-story">
  <div class="s-story__copy">
    <p class="s-story__eyebrow">{{eyebrow}}</p>
    <h2 class="s-story__title">{{title}}</h2>
    <p class="s-story__body">{{body}}</p>
    <blockquote class="s-story__quote">
      <p>{{quote.text}}</p>
      <cite>{{quote.author}}</cite>
    </blockquote>
  </div>
  <div class="s-story__media"><img src="{{image.src}}" alt="{{image.alt}}" loading="lazy" /></div>
</section>
